name: zoom
description: "A local package wrapping Zoom Meeting SDK integration."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.testpress.flutter_zoom_meeting_sdk
        pluginClass: FlutterZoomMeetingSdkPlugin
        dartPluginClass: ZoomPlugin
      ios:
        pluginClass: FlutterZoomMeetingSdkPlugin
        dartPluginClass: ZoomPlugin
