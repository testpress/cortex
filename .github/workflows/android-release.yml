name: Android Release

on:
  workflow_call:
    inputs:
      subdomain:
        description: 'Client subdomain'
        required: true
        type: string
      config_path:
        description: 'Path to custom config JSON (optional)'
        required: false
        type: string
        default: ''
    secrets:
      API_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build & Release Android App
    runs-on: ubuntu-latest
    env:
      API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
      SUBDOMAIN: ${{ inputs.subdomain }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      # Cache Gradle wrapper distribution (~150 MB gradle-8.14-all.zip).
      # Keyed on the distributionUrl so a Gradle version bump busts the cache.
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      # Cache Gradle build outputs (compiled classes, dependency jars, R8 outputs).
      # Keyed on a hash of all Gradle build scripts + pubspec.lock so a dependency
      # or build-config change correctly busts the cache.
      # A restore-key fallback allows a partial cache hit on pubspec.lock changes.
      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle.properties', 'app/pubspec.lock', 'packages/**/pubspec.lock') }}
          restore-keys: |
            gradle-caches-

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane

      - name: Fetch Dependencies
        run: |
          for dir in app packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/pubspec.yaml" ]; then
              echo "Fetching dependencies in $dir..."
              (cd "$dir" && flutter pub get)
            fi
          done

      # Pre-install Android SDK components that native plugins (sqlite3_flutter_libs,
      # jni) would otherwise download during bundleRelease, adding ~3-5 min.
      - name: Pre-install Android SDK components
        run: |
          echo "Installing required Android SDK components..."
          sdkmanager --install "platforms;android-31" "cmake;3.22.1" 2>&1 | tail -5
          echo "SDK components installed."

      - name: Prepare Release Configuration
        id: prep
        env:
          SUBDOMAIN_INPUT: ${{ inputs.subdomain }}
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
        run: |
          if [ -n "$CONFIG_PATH_INPUT" ]; then
            dart run app/scripts/prepare_release.dart \
              --subdomain="$SUBDOMAIN_INPUT" \
              --platform=android \
              --config="$CONFIG_PATH_INPUT"
          else
            dart run app/scripts/prepare_release.dart \
              --subdomain="$SUBDOMAIN_INPUT" \
              --platform=android
          fi

      - name: Build Android App Bundle (Release)
        working-directory: app
        env:
          APP_VERSION: ${{ steps.prep.outputs.version }}
          BUILD_NUMBER: ${{ steps.prep.outputs.build_number }}
        run: |
          echo "::group::Flutter build appbundle"
          BUILD_START=$SECONDS
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=dart_defines.json
          BUILD_DURATION=$(( SECONDS - BUILD_START ))
          echo "::endgroup::"
          echo "Android build completed in ${BUILD_DURATION}s ($(( BUILD_DURATION / 60 ))m $(( BUILD_DURATION % 60 ))s)"

      - name: Deploy to Google Play Store
        run: bundle exec fastlane android deploy

      - name: Upload AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.subdomain }}-Android-AAB
          path: app/build/app/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: warn
