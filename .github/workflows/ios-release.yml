name: iOS Release

on:
  workflow_call:
    inputs:
      subdomain:
        description: 'Client subdomain'
        required: true
        type: string
      config_path:
        description: 'Path to custom config JSON (optional)'
        required: false
        type: string
        default: ''
    secrets:
      API_ACCESS_KEY:
        required: true
      CERT_P12_BASE64:
        required: true
      CERT_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build & Release iOS App
    runs-on: macos-latest
    env:
      API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
      SUBDOMAIN: ${{ inputs.subdomain }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane

      - name: Install Signing Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -s build.keychain
          rm -f cert.p12

      - name: Fetch Dependencies
        run: |
          for dir in app packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/pubspec.yaml" ]; then
              echo "Fetching dependencies in $dir..."
              (cd "$dir" && flutter pub get)
            fi
          done

      - name: Prepare Release Configuration
        id: prep
        run: |
          if [ -n "${{ inputs.config_path }}" ]; then
            dart run app/scripts/prepare_release.dart \
              --subdomain="${{ inputs.subdomain }}" \
              --platform=ios \
              --config="${{ inputs.config_path }}"
          else
            dart run app/scripts/prepare_release.dart \
              --subdomain="${{ inputs.subdomain }}" \
              --platform=ios
          fi

      - name: Fetch Provisioning Profile (Fastlane Sigh)
        run: |
          bundle exec fastlane ios get_profile \
            bundle_id:"${{ steps.prep.outputs.bundle_id }}" \
            key_id:"${{ steps.prep.outputs.apple_key_id }}" \
            issuer_id:"${{ steps.prep.outputs.apple_issuer_id }}" \
            key_filepath:"${{ steps.prep.outputs.apple_key_path }}"

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install

      - name: Build iOS IPA (Release)
        working-directory: app
        run: |
          flutter build ipa --release \
            --build-name="${{ steps.prep.outputs.version }}" \
            --build-number="${{ steps.prep.outputs.build_number }}" \
            ${{ steps.prep.outputs.dart_defines }}

      - name: Deploy to TestFlight
        run: |
          bundle exec fastlane ios deploy \
            key_id:"${{ steps.prep.outputs.apple_key_id }}" \
            issuer_id:"${{ steps.prep.outputs.apple_issuer_id }}" \
            key_filepath:"${{ steps.prep.outputs.apple_key_path }}"

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.subdomain }}-iOS-IPA
          path: app/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: warn
