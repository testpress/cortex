name: iOS Release

on:
  workflow_call:
    inputs:
      subdomain:
        description: 'Client subdomain'
        required: true
        type: string
      config_path:
        description: 'Path to custom config JSON (optional)'
        required: false
        type: string
        default: ''
    secrets:
      API_ACCESS_KEY:
        required: true
      CERT_P12_BASE64:
        required: true
      CERT_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build & Release iOS App
    runs-on: macos-latest
    env:
      API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
      SUBDOMAIN: ${{ inputs.subdomain }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane

      - name: Install System Dependencies
        run: brew install --quiet imagemagick

      - name: Install Signing Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -s build.keychain
          rm -f cert.p12

      - name: Fetch Dependencies
        run: |
          for dir in app packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/pubspec.yaml" ]; then
              echo "Fetching dependencies in $dir..."
              (cd "$dir" && flutter pub get)
            fi
          done

      - name: Prepare Release Configuration
        id: prep
        env:
          SUBDOMAIN_INPUT: ${{ inputs.subdomain }}
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
        run: |
          if [ -n "$CONFIG_PATH_INPUT" ]; then
            dart run app/scripts/prepare_release.dart \
              --subdomain="$SUBDOMAIN_INPUT" \
              --platform=ios \
              --config="$CONFIG_PATH_INPUT"
          else
            dart run app/scripts/prepare_release.dart \
              --subdomain="$SUBDOMAIN_INPUT" \
              --platform=ios
          fi

      - name: Install CocoaPods
        # ruby/setup-ruby switches to Ruby 3.2, breaking the pre-installed system
        # CocoaPods. Reinstall it in the new Ruby environment so `pod` is usable
        # by both this step and Flutter's internal pod install during the build.
        run: |
          gem install cocoapods --no-document
          cd app/ios && pod install

      # Single lane handles everything: get_provisioning_profile → flutter build
      # (--no-codesign) → build_app export with manual signing → upload_to_testflight.
      # Mirrors the reference repo pattern exactly, Flutter compilation is the only addition.
      - name: Build & Deploy to TestFlight
        env:
          APP_VERSION: ${{ steps.prep.outputs.version }}
          BUILD_NUMBER: ${{ steps.prep.outputs.build_number }}
        run: bundle exec fastlane ios deploy

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.subdomain }}-iOS-IPA
          # gym (build_app) outputs the IPA to the workspace root by default.
          # The glob covers both gym's default location and flutter build ipa's path.
          path: |
            *.ipa
            app/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.subdomain }}-iOS-gym-logs
          path: ~/Library/Logs/gym/
          if-no-files-found: ignore
