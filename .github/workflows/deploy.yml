name: Deploy/Release App
run-name: 'Release ${{ inputs.subdomain }}'

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Client subdomain (e.g. lmsdemo)'
        required: true
        type: string
      config_path:
        description: 'Path to custom config JSON (optional)'
        required: false
        type: string
      build_android:
        description: 'Release Android'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Release iOS'
        required: false
        type: boolean
        default: true
      version_type:
        description: 'Semantic Version Bump Type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      android_release_status:
        description: 'Google Play Android release status (draft prevents rollout)'
        required: false
        type: choice
        options:
          - draft
          - completed
        default: draft
      app_version_baseline:
        description: 'Highest existing app version (X.Y.Z). Deploy Testpress baseline support before using these inputs.'
        required: false
        type: string
        default: ''
      android_version_code_baseline:
        description: 'Highest Android version code used, even for an iOS-only release'
        required: false
        type: string
        default: ''
      ios_build_number_baseline:
        description: 'Highest existing iOS build number (ios_version_code in Testpress), even for an Android-only release'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare_and_bump:
    name: Validate and Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: Validate Inputs
        env:
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_IOS: ${{ inputs.build_ios }}
          APP_VERSION_BASELINE: ${{ inputs.app_version_baseline }}
          ANDROID_VERSION_CODE_BASELINE: ${{ inputs.android_version_code_baseline }}
          IOS_BUILD_NUMBER_BASELINE: ${{ inputs.ios_build_number_baseline }}
          SUBDOMAIN: ${{ inputs.subdomain }}
        run: |
          if [ "$BUILD_ANDROID" != "true" ] && [ "$BUILD_IOS" != "true" ]; then
            echo "::error::At least one platform (Android or iOS) must be selected."
            exit 1
          fi
          if [[ ! "$SUBDOMAIN" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::error::Subdomain must contain only alphanumeric characters and hyphens"
            exit 1
          fi

          VERSION_PATTERN='^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
          if [[ -n "$APP_VERSION_BASELINE" ]] &&
             [[ ! "$APP_VERSION_BASELINE" =~ $VERSION_PATTERN || ${#APP_VERSION_BASELINE} -gt 12 ]]; then
            echo "::error::App version baseline must be in X.Y.Z format and at most 12 characters."
            exit 1
          fi

          validate_build_baseline() {
            local label="$1" value="$2" max="$3"
            if [[ -z "$value" ]]; then
              return
            fi
            if [[ ! "$value" =~ ^[1-9][0-9]{0,9}$ ]] || (( value > max )); then
              echo "::error::$label baseline must be a positive integer no greater than $max."
              exit 1
            fi
          }

          validate_build_baseline "Android version code" "$ANDROID_VERSION_CODE_BASELINE" 2099999999
          validate_build_baseline "iOS build number" "$IOS_BUILD_NUMBER_BASELINE" 2147483646

      - name: Bump Version on Cortex Server
        env:
          SUBDOMAIN: ${{ inputs.subdomain }}
          VERSION_TYPE: ${{ inputs.version_type }}
          APP_VERSION_BASELINE: ${{ inputs.app_version_baseline }}
          ANDROID_VERSION_CODE_BASELINE: ${{ inputs.android_version_code_baseline }}
          IOS_BUILD_NUMBER_BASELINE: ${{ inputs.ios_build_number_baseline }}
          API_ACCESS_KEY: ${{ secrets.TESTPRESS_API_KEY }}
        run: |
          echo "Bumping $VERSION_TYPE version for subdomain: $SUBDOMAIN"
          PAYLOAD=$(jq -cn \
            --arg bump_type "$VERSION_TYPE" \
            --arg app_version_baseline "$APP_VERSION_BASELINE" \
            --arg android_version_code_baseline "$ANDROID_VERSION_CODE_BASELINE" \
            --arg ios_build_number_baseline "$IOS_BUILD_NUMBER_BASELINE" \
            '$ARGS.named | with_entries(select(.value != ""))')

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          HTTP_STATUS=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' -X PUT \
            "https://${SUBDOMAIN}.testpress.in/api/v2.5/admin/cortex/update/" \
            -H "API-ACCESS-KEY: $API_ACCESS_KEY" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Version bump failed with HTTP status $HTTP_STATUS. Check the bump type and version baselines."
            exit 1
          fi
          if ! jq -e '
            (.version | type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$")) and
            (.android_version_code | type == "number" and . > 0 and . == floor) and
            (.ios_version_code | type == "number" and . > 0 and . == floor)
          ' "$RESPONSE_FILE" >/dev/null 2>&1; then
            echo "::error::The version endpoint returned missing or invalid version fields. It may already have bumped the version. Check the Cortex config before retrying."
            exit 1
          fi

          if ! jq -e --argjson request "$PAYLOAD" '
            def version_parts: split(".") | map(tonumber);
            (($request | has("app_version_baseline") | not) or
              ((.version | version_parts) > ($request.app_version_baseline | version_parts))) and
            (($request | has("android_version_code_baseline") | not) or
              (.android_version_code > ($request.android_version_code_baseline | tonumber))) and
            (($request | has("ios_build_number_baseline") | not) or
              (.ios_version_code > ($request.ios_build_number_baseline | tonumber)))
          ' "$RESPONSE_FILE" >/dev/null; then
            echo "::error::The server bumped the version, but the result did not exceed the supplied baselines. Check the Cortex config before retrying."
            exit 1
          fi
          echo "Version successfully updated on server."

  android_release:
    name: Android Release
    needs: prepare_and_bump
    if: ${{ inputs.build_android }}
    uses: ./.github/workflows/android-release.yml
    with:
      subdomain: ${{ inputs.subdomain }}
      config_path: ${{ inputs.config_path || '' }}
      release_status: ${{ inputs.android_release_status }}
    secrets:
      API_ACCESS_KEY: ${{ secrets.TESTPRESS_API_KEY }}

  ios_release:
    name: iOS Release
    needs: prepare_and_bump
    if: ${{ inputs.build_ios }}
    uses: ./.github/workflows/ios-release.yml
    with:
      subdomain: ${{ inputs.subdomain }}
      config_path: ${{ inputs.config_path || '' }}
    secrets:
      API_ACCESS_KEY: ${{ secrets.TESTPRESS_API_KEY }}
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

